name: Update Curious Mind headlines
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public RSS feeds
        run: python scripts/update_news.py --output docs/feed.json
      - name: Commit new headlines
        run: |
          git config user.name "curious-mind-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Update news feed"
            git push
          fi
